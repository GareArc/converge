services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: converge
      POSTGRES_PASSWORD: converge
      POSTGRES_DB: converge
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U converge"]
      interval: 2s
      timeout: 2s
      retries: 15

  httpbin:
    image: mccutchen/go-httpbin:v2.15.0
    environment:
      PORT: "80"
    expose:
      - "80"

  app:
    build:
      context: ../..
      dockerfile: examples/gin/Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      REDIS_ADDR: "redis:6379"
      POSTGRES_DSN: "postgres://converge:converge@postgres:5432/converge?sslmode=disable"
    ports:
      - "8080:8080"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
